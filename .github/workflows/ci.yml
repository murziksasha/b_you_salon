name: CI
on:
  pull_request:
    branches: [dev, main]
  push:
    branches: [dev]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check
      - name: Production dependency audit
        run: npm audit --omit=dev
      - name: Seed site data for build
        run: npm run seed
      - name: Production build
        run: npm run build
      - name: Smoke E2E Tests
        run: |
          npx playwright install --with-deps chromium
          npm run test:smoke
        env:
          CI: 1
      - name: No empty source files in features/
        run: test -z "$(find features -type f -size 0 2>/dev/null)"
