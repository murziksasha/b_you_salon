<!DOCTYPE html>
<html lang="uk">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#02a653" />
    <title>Офлайн — Proper Service</title>
    <style>
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        font-family: system-ui, -apple-system, sans-serif;
        background: #f4f6f8;
        color: #1a1a1a;
        padding: 24px;
      }
      .card {
        background: #fff;
        border-radius: 12px;
        padding: 32px 28px;
        max-width: 420px;
        width: 100%;
        box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
        text-align: center;
      }
      .brand {
        color: #02a653;
        font-weight: 700;
        letter-spacing: 0.02em;
        margin-bottom: 8px;
      }
      h1 {
        margin: 0 0 12px;
        font-size: 1.35rem;
      }
      p {
        margin: 0 0 20px;
        color: #555;
        line-height: 1.5;
      }
      button {
        background: #02a653;
        color: #fff;
        border: none;
        border-radius: 8px;
        padding: 10px 18px;
        font-size: 1rem;
        cursor: pointer;
      }
      button:hover {
        filter: brightness(0.95);
      }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="brand">Proper Service</div>
      <h1>Немає з’єднання</h1>
      <p>
        Сторінка недоступна офлайн. Перевірте мережу (Wi‑Fi / Keen DNS) і спробуйте
        ще раз.
      </p>
      <button type="button" onclick="location.reload()">Спробувати знову</button>
    </div>
  </body>
</html>
